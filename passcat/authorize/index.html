<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>認証完了 / Authentication Complete - PassCat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0377f6;
      --heading: #00102e;
      --text: #233452;
    }
    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 4rem 1.25rem;
      line-height: 1.9;
      color: var(--text);
      background: #fff;
      text-align: center;
    }
    .check {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg {
      width: 2.4rem;
      height: 2.4rem;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--heading);
      margin: 0 0 1rem;
    }
    p { margin: .5rem 0; }
    .en { color: #6c7a92; font-size: .95rem; margin-top: 2rem; }
    footer { margin-top: 3.5rem; font-size: .8rem; color: #9aa4b5; }
  </style>
</head>
<body>
  <div class="check" aria-hidden="true">
    <svg viewBox="0 0 24 24"><polyline points="4 12.5 10 18.5 20 6.5"/></svg>
  </div>

  <h1>認証が完了しました</h1>
  <p>このページを閉じて、PassCat アプリにお戻りください。</p>

  <div class="en">
    <strong>Authentication complete.</strong><br>
    You can close this page and return to the PassCat app.
  </div>

  <footer>© birdrune</footer>
</body>
</html>
